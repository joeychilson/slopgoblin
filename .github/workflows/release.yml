name: Release

# Tag a commit on main `v<version>`, the version in extension/public/manifest.json, once
# CHANGELOG.md has a section for it. The release gets the zip to upload to the Chrome Web Store.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declared=$(jq -r .version extension/public/manifest.json)
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME and the manifest's version, $declared, disagree."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. A release is made from a commit on main."
            exit 1
          fi
          if ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

  verify:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      - run: vp -C extension build
      - name: Pack the extension
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/slopgoblin-${GITHUB_REF_NAME#v}.zip"
          (cd extension/dist && zip -qrX "$zip" .)
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## $version" '$0 == head { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" --title "$version" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
