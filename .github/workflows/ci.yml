name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs Vite+, Node and pnpm, then the dependencies.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - run: vp check
      - run: vp test
      # The end-to-end tests build the extension and load it into Chromium. The runner has the
      # libraries Chromium needs already, with its own Chrome.
      - run: vp exec playwright install --no-shell chromium
      - run: vp run e2e
